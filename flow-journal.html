<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F5F3F0">
    <title>心流存摺</title>
    <link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500;600&display=swap');
        
        :root {
            --cream: #F5F3F0;
            --sand: #E8E4DF;
            --clay: #D4CEC7;
            --stone: #8B8680;
            --charcoal: #3A3632;
            --ink: #1A1816;
            --accent-sage: #9CAF88;
            --accent-warm: #C9A882;
            --shadow: rgba(26, 24, 22, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Noto Serif TC', serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--sand) 100%);
            color: var(--ink);
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--cream);
            box-shadow: 0 0 40px var(--shadow);
        }
        
        .header {
            background: linear-gradient(135deg, var(--charcoal), var(--stone));
            color: var(--cream);
            padding: 3rem 1.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(245,243,240,0.03)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.5;
        }
        
        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            position: relative;
            margin-bottom: 0.5rem;
        }
        
        .header-subtitle {
            font-size: 0.75rem;
            opacity: 0.7;
            letter-spacing: 0.2em;
            position: relative;
        }
        
        .nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            padding: 1.5rem;
            background: var(--cream);
        }
        
        .nav-btn {
            background: white;
            border: 1px solid var(--clay);
            padding: 1.5rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            box-shadow: 0 2px 8px var(--shadow);
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--shadow);
            border-color: var(--accent-sage);
        }
        
        .nav-btn:active {
            transform: translateY(0);
        }
        
        .nav-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .nav-label {
            font-size: 0.85rem;
            color: var(--charcoal);
            font-weight: 500;
        }
        
        .screen {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        
        .screen.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-container {
            padding: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--charcoal);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--clay);
            border-radius: 8px;
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            background: white;
            transition: all 0.3s ease;
        }
        
        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent-sage);
            box-shadow: 0 0 0 3px rgba(156, 175, 136, 0.1);
        }
        
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .tag {
            padding: 0.5rem 1rem;
            border: 1px solid var(--clay);
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }
        
        .tag.selected {
            background: var(--accent-sage);
            color: white;
            border-color: var(--accent-sage);
        }
        
        .context-group {
            margin-top: 0.5rem;
            padding: 1rem;
            background: var(--sand);
            border-radius: 8px;
        }
        
        .context-item {
            margin-bottom: 0.75rem;
        }
        
        .context-item:last-child {
            margin-bottom: 0;
        }
        
        .context-label {
            font-size: 0.85rem;
            color: var(--stone);
            margin-bottom: 0.25rem;
            display: block;
        }
        
        .context-input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--clay);
            border-radius: 6px;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.9rem;
            background: white;
        }
        
        .slider-container {
            padding: 1rem 0;
        }
        
        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--sand);
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-sage);
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow);
        }
        
        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-sage);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px var(--shadow);
        }
        
        .slider-value {
            text-align: center;
            font-size: 2rem;
            font-weight: 500;
            color: var(--accent-sage);
            margin-top: 0.5rem;
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        
        .btn-primary {
            background: var(--charcoal);
            color: var(--cream);
        }
        
        .btn-primary:hover {
            background: var(--ink);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--shadow);
        }
        
        .btn-secondary {
            background: var(--sand);
            color: var(--charcoal);
        }
        
        .btn-secondary:hover {
            background: var(--clay);
        }
        
        .records-container {
            padding: 1.5rem;
        }
        
        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        
        .filter-tab {
            padding: 0.5rem 1rem;
            border: 1px solid var(--clay);
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            background: white;
            transition: all 0.3s ease;
        }
        
        .filter-tab.active {
            background: var(--charcoal);
            color: var(--cream);
            border-color: var(--charcoal);
        }
        
        .record-card {
            background: white;
            border: 1px solid var(--clay);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .record-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--shadow);
        }
        
        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .record-time {
            font-size: 0.85rem;
            color: var(--stone);
        }
        
        .record-type {
            font-size: 1.5rem;
        }
        
        .record-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--charcoal);
            margin-bottom: 0.5rem;
        }
        
        .record-meta {
            font-size: 0.85rem;
            color: var(--stone);
        }
        
        .record-details {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--sand);
            animation: slideDown 0.3s ease-out;
        }
        
        .record-details.active {
            display: block;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .record-detail-item {
            margin-bottom: 0.75rem;
        }
        
        .record-detail-label {
            font-size: 0.8rem;
            color: var(--stone);
            margin-bottom: 0.25rem;
        }
        
        .record-detail-content {
            font-size: 0.9rem;
            color: var(--charcoal);
        }
        
        .action-item {
            background: white;
            border: 1px solid var(--clay);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .action-item:hover {
            border-color: var(--accent-sage);
            box-shadow: 0 2px 8px var(--shadow);
        }
        
        .action-content {
            font-size: 1rem;
            color: var(--charcoal);
            margin-bottom: 0.5rem;
        }
        
        .action-stats {
            font-size: 0.85rem;
            color: var(--stone);
        }
        
        .action-usage {
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--sand);
            font-size: 0.8rem;
            color: var(--stone);
        }
        
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: white;
            border: 2px solid var(--accent-sage);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 80%;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .message.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        
        .message-text {
            font-size: 1.1rem;
            color: var(--charcoal);
            margin-bottom: 1rem;
        }
        
        .message-btn {
            background: var(--accent-sage);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.9rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--stone);
        }
        
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 0.9rem;
        }
        
        .back-btn {
            position: fixed;
            top: 1rem;
            left: 1rem;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--clay);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px var(--shadow);
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: white;
            transform: scale(1.1);
        }

        /* 會員系統樣式 */
        .member-section {
            margin: 1rem 1.5rem;
            padding: 1rem;
            background: white;
            border: 1px solid var(--clay);
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .member-logged-out {
            text-align: center;
        }

        .member-title {
            font-size: 0.9rem;
            color: var(--stone);
            margin-bottom: 0.75rem;
        }

        .google-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem 1rem;
            background: white;
            border: 1px solid var(--clay);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--charcoal);
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px var(--shadow);
        }

        .google-login-btn:hover {
            background: #f8f9fa;
            border-color: var(--accent-sage);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px var(--shadow);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .member-logged-in {
            display: none;
        }

        .member-logged-in.active {
            display: block;
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .member-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent-sage);
        }

        .member-details {
            flex: 1;
        }

        .member-name {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--charcoal);
        }

        .member-email {
            font-size: 0.75rem;
            color: var(--stone);
            margin-top: 0.15rem;
        }

        .member-actions {
            display: flex;
            gap: 0.5rem;
        }

        .member-btn {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--clay);
            border-radius: 6px;
            background: var(--sand);
            color: var(--charcoal);
            font-family: 'Noto Serif TC', serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .member-btn:hover {
            background: var(--clay);
        }

        .member-btn.logout {
            background: white;
            color: var(--stone);
        }

        .member-btn.logout:hover {
            background: #ffe5e5;
            color: #d32f2f;
            border-color: #d32f2f;
        }

        .sync-status {
            font-size: 0.75rem;
            color: var(--stone);
            text-align: center;
            margin-top: 0.5rem;
        }

        .sync-status.syncing {
            color: var(--accent-sage);
        }

        .sync-status.error {
            color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>心流存摺</h1>
            <div class="header-subtitle">記錄成長 · 感知情緒</div>
        </div>

        <div id="homeScreen" class="screen active">
            <div class="nav">
                <button class="nav-btn" onclick="showScreen('achievementScreen')">
                    <span class="nav-icon">✨</span>
                    <span class="nav-label">記錄完成</span>
                </button>
                <button class="nav-btn" onclick="showScreen('emotionScreen')">
                    <span class="nav-icon">💭</span>
                    <span class="nav-label">記錄情緒</span>
                </button>
                <button class="nav-btn" onclick="showScreen('recordsScreen')">
                    <span class="nav-icon">📖</span>
                    <span class="nav-label">查看記錄</span>
                </button>
            </div>
            
            <div style="padding: 1rem 1.5rem; background: var(--sand); border-radius: 12px; margin: 0 1.5rem; font-size: 0.85rem; color: var(--stone);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>📊 已記錄 <strong id="recordCount" style="color: var(--charcoal);">0</strong> 筆</span>
                    <span id="lastSaved" style="font-size: 0.75rem;">載入中...</span>
                </div>
                <div style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--stone);">
                    💡 提示：定期匯出備份,避免資料遺失
                </div>
            </div>

            <!-- 會員登入/管理區域 -->
            <div class="member-section">
                <!-- 未登入狀態 -->
                <div id="memberLoggedOut" class="member-logged-out">
                    <div class="member-title">🔐 登入會員，資料雲端同步</div>
                    <button class="google-login-btn" onclick="handleGoogleLogin()">
                        <svg class="google-icon" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        使用 Google 帳號登入
                    </button>
                </div>

                <!-- 已登入狀態 -->
                <div id="memberLoggedIn" class="member-logged-in">
                    <div class="member-info">
                        <img id="memberAvatar" class="member-avatar" src="" alt="頭像" onerror="this.style.display='none'">
                        <div class="member-details">
                            <div class="member-name" id="memberName">載入中...</div>
                            <div class="member-email" id="memberEmail"></div>
                        </div>
                    </div>
                    <div class="member-actions">
                        <button class="member-btn" onclick="handleSyncToCloud()">☁️ 同步到雲端</button>
                        <button class="member-btn logout" onclick="handleLogout()">登出</button>
                    </div>
                    <div id="syncStatus" class="sync-status"></div>
                </div>
            </div>
        </div>
        <div id="achievementScreen" class="screen">
            <button class="back-btn" onclick="showScreen('homeScreen')">←</button>
            <div class="form-container">
                <h2 style="margin-bottom: 1.5rem; font-family: 'Cormorant Garamond', serif; font-weight: 400;">記錄完成事項</h2>
                
                <form id="achievementForm">
                    <div class="form-group">
                        <label class="form-label">時間</label>
                        <input type="datetime-local" id="achTime" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">標題</label>
                        <input type="text" id="achTitle" class="form-input" placeholder="一句話描述你完成了什麼" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">分類</label>
                        <div class="tags-container">
                            <div class="tag" data-value="旗袍設計">旗袍設計</div>
                            <div class="tag" data-value="BNI活動">BNI活動</div>
                            <div class="tag" data-value="創作">創作</div>
                            <div class="tag" data-value="其他">其他</div>
                        </div>
                        <input type="hidden" id="achCategory" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">展現的能力</label>
                        <div class="tags-container">
                            <div class="tag" data-value="創意">創意</div>
                            <div class="tag" data-value="執行力">執行力</div>
                            <div class="tag" data-value="溝通">溝通</div>
                            <div class="tag" data-value="領導">領導</div>
                            <div class="tag" data-value="問題解決">問題解決</div>
                            <div class="tag" data-value="美感">美感</div>
                        </div>
                        <input type="hidden" id="achSkills">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">儲存記錄</button>
                </form>
            </div>
        </div>

        <div id="emotionScreen" class="screen">
            <button class="back-btn" onclick="showScreen('homeScreen')">←</button>
            <div class="form-container">
                <h2 style="margin-bottom: 1.5rem; font-family: 'Cormorant Garamond', serif; font-weight: 400;">記錄情緒時刻</h2>
                
                <form id="emotionForm">
                    <div class="form-group">
                        <label class="form-label">時間</label>
                        <input type="datetime-local" id="emoTime" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">情緒類型</label>
                        <div class="tags-container">
                            <div class="tag" data-value="快樂感恩" data-icon="😊" data-category="happy">😊 快樂感恩</div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 應用模組 -->
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>

    <script>
        let records = [];
        let commonActions = ['看書', '冥想', '運動拉伸', '散步走路', '騎滑板車', '畫畫'];
        
        function loadData() {
            try {
                const savedRecords = localStorage.getItem('flowJournalRecords');
                
                if (savedRecords) {
                    records = JSON.parse(savedRecords);
                    console.log('Loaded records:', records.length);
                }
                
                saveToIndexedDB();
                
            } catch (error) {
                console.error('Error loading data:', error);
                loadFromIndexedDB();
            }
        }
        
        async function saveData() {
            try {
                const saveTime = new Date().toISOString();
                localStorage.setItem('flowJournalRecords', JSON.stringify(records));
                localStorage.setItem('flowJournalLastSaved', saveTime);
                saveToIndexedDB();
                console.log('Data saved successfully at', saveTime);
                if (document.getElementById('recordCount')) {
                    updateDataStatus();
                }

                // 如果已登入，自動同步最新記錄到雲端
                if (window.FlowJournal && window.FlowJournal.auth) {
                    const isLoggedIn = await window.FlowJournal.auth.isLoggedIn();
                    if (isLoggedIn && records.length > 0) {
                        // 同步最新的記錄（假設剛新增的）
                        const latestRecord = records[0];
                        try {
                            await window.FlowJournal.sync.uploadRecord(latestRecord);
                            console.log('已自動同步最新記錄到雲端');
                        } catch (syncError) {
                            console.error('自動同步失敗:', syncError);
                        }
                    }
                }
            } catch (error) {
                console.error('Error saving data:', error);
                alert('儲存失敗!請立即匯出備份。錯誤: ' + error.message);
            }
        }
        
        let db;
        
        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('FlowJournalDB', 1);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    db = event.target.result;
                    if (!db.objectStoreNames.contains('records')) {
                        db.createObjectStore('records', { keyPath: 'key' });
                    }
                };
            });
        }
        
        function saveToIndexedDB() {
            if (!db) return;
            
            try {
                const transaction = db.transaction(['records'], 'readwrite');
                const store = transaction.objectStore('records');
                
                store.put({ key: 'records', data: records });
                store.put({ key: 'lastSaved', data: new Date().toISOString() });
                
                console.log('Saved to IndexedDB');
            } catch (error) {
                console.error('IndexedDB save error:', error);
            }
        }
        
        function loadFromIndexedDB() {
            if (!db) return;
            
            try {
                const transaction = db.transaction(['records'], 'readonly');
                const store = transaction.objectStore('records');
                
                const recordsRequest = store.get('records');
                
                recordsRequest.onsuccess = () => {
                    if (recordsRequest.result) {
                        records = recordsRequest.result.data;
                        localStorage.setItem('flowJournalRecords', JSON.stringify(records));
                        console.log('Recovered from IndexedDB:', records.length, 'records');
                    }
                };
            } catch (error) {
                console.error('IndexedDB load error:', error);
            }
        }
        
        setInterval(() => {
            if (records.length > 0) {
                saveData();
            }
        }, 30000);
        
        window.addEventListener('beforeunload', () => {
            saveData();
        });
        
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                saveData();
            }
        });
        
        initIndexedDB().then(() => {
            loadData();
            updateDataStatus();
            initMemberSystem();
        }).catch(error => {
            console.error('IndexedDB init error:', error);
            loadData();
            updateDataStatus();
            initMemberSystem();
        });

        // ========== 會員系統相關函數 ==========

        async function initMemberSystem() {
            try {
                // 等待 Supabase 初始化
                await new Promise(resolve => {
                    if (window.FlowJournal && window.FlowJournal.supabase) {
                        resolve();
                    } else {
                        setTimeout(resolve, 500);
                    }
                });

                await checkLoginStatus();
            } catch (error) {
                console.error('會員系統初始化錯誤:', error);
            }
        }

        async function checkLoginStatus() {
            try {
                const isLoggedIn = await window.FlowJournal.auth.isLoggedIn();

                if (isLoggedIn) {
                    const userInfo = await window.FlowJournal.auth.getUserInfo();
                    showLoggedInUI(userInfo);
                    await loadFromCloud();
                } else {
                    showLoggedOutUI();
                }
            } catch (error) {
                console.error('檢查登入狀態錯誤:', error);
                showLoggedOutUI();
            }
        }

        function showLoggedInUI(userInfo) {
            document.getElementById('memberLoggedOut').style.display = 'none';
            document.getElementById('memberLoggedIn').classList.add('active');

            document.getElementById('memberName').textContent = userInfo.name;
            document.getElementById('memberEmail').textContent = userInfo.email;

            if (userInfo.avatar) {
                const avatar = document.getElementById('memberAvatar');
                avatar.src = userInfo.avatar;
                avatar.style.display = 'block';
            }
        }

        function showLoggedOutUI() {
            document.getElementById('memberLoggedOut').style.display = 'block';
            document.getElementById('memberLoggedIn').classList.remove('active');
        }

        async function handleGoogleLogin() {
            try {
                setSyncStatus('正在登入...', 'syncing');
                await window.FlowJournal.auth.signInWithGoogle();
            } catch (error) {
                console.error('登入錯誤:', error);
                setSyncStatus('登入失敗，請重試', 'error');
                setTimeout(() => setSyncStatus(''), 3000);
            }
        }

        async function handleLogout() {
            if (!confirm('登出後，本地記錄仍會保留。確定要登出嗎？')) {
                return;
            }

            try {
                await window.FlowJournal.auth.signOut();
                showLoggedOutUI();
                showMessage('已登出');
            } catch (error) {
                console.error('登出錯誤:', error);
                showMessage('登出失敗：' + error.message);
            }
        }

        async function handleSyncToCloud() {
            try {
                setSyncStatus('正在同步...', 'syncing');

                let successCount = 0;
                let errorCount = 0;

                for (const record of records) {
                    try {
                        await window.FlowJournal.sync.uploadRecord(record);
                        successCount++;
                    } catch (error) {
                        console.error('同步記錄失敗:', record.id, error);
                        errorCount++;
                    }
                }

                if (errorCount === 0) {
                    setSyncStatus(`✓ 已同步 ${successCount} 筆記錄`, '');
                    setTimeout(() => setSyncStatus(''), 3000);
                } else {
                    setSyncStatus(`同步完成：${successCount} 成功，${errorCount} 失敗`, 'error');
                }
            } catch (error) {
                console.error('同步錯誤:', error);
                setSyncStatus('同步失敗，請重試', 'error');
            }
        }

        async function loadFromCloud() {
            try {
                const supabase = window.FlowJournal.supabase.get();
                const user = await window.FlowJournal.auth.getUser();

                if (!user) return;

                const { data: cloudRecords, error } = await supabase
                    .from('records')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('time', { ascending: false });

                if (error) throw error;

                if (cloudRecords && cloudRecords.length > 0) {
                    // 合併雲端記錄和本地記錄
                    const existingIds = new Set(records.map(r => r.id));
                    const newRecords = cloudRecords.filter(r => !existingIds.has(r.id));

                    if (newRecords.length > 0) {
                        records = [...records, ...newRecords];
                        records.sort((a, b) => new Date(b.time) - new Date(a.time));
                        saveData();

                        console.log(`從雲端載入 ${newRecords.length} 筆新記錄`);
                        setSyncStatus(`✓ 已載入 ${cloudRecords.length} 筆雲端記錄`, '');
                        setTimeout(() => setSyncStatus(''), 3000);
                    }
                }
            } catch (error) {
                console.error('從雲端載入記錄錯誤:', error);
            }
        }

        function setSyncStatus(message, className = '') {
            const statusEl = document.getElementById('syncStatus');
            if (statusEl) {
                statusEl.textContent = message;
                statusEl.className = 'sync-status ' + className;
            }
        }

        // ========== 會員系統函數結束 ==========

        function setCurrentTime() {
            const now = new Date();
            const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
                .toISOString()
                .slice(0, 16);
            document.getElementById('achTime').value = localDateTime;
            document.getElementById('emoTime').value = localDateTime;
        }
        
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            
            if (screenId === 'achievementScreen' || screenId === 'emotionScreen') {
                setCurrentTime();
            }
            
            if (screenId === 'recordsScreen') {
                renderRecords('timeline');
            }
            
            if (screenId === 'homeScreen') {
                updateDataStatus();
            }
        }
        
        function updateDataStatus() {
            document.getElementById('recordCount').textContent = records.length;
            
            const lastSavedTime = localStorage.getItem('flowJournalLastSaved');
            if (lastSavedTime) {
                const date = new Date(lastSavedTime);
                const now = new Date();
                const diffMinutes = Math.floor((now - date) / 60000);
                
                let timeStr;
                if (diffMinutes < 1) {
                    timeStr = '剛剛儲存';
                } else if (diffMinutes < 60) {
                    timeStr = `${diffMinutes} 分鐘前儲存`;
                } else if (diffMinutes < 1440) {
                    timeStr = `${Math.floor(diffMinutes / 60)} 小時前儲存`;
                } else {
                    timeStr = `${Math.floor(diffMinutes / 1440)} 天前儲存`;
                }
                
                document.getElementById('lastSaved').textContent = timeStr;
            } else {
                document.getElementById('lastSaved').textContent = '尚未儲存';
            }
        }
        
        document.querySelectorAll('.tags-container').forEach(container => {
            container.querySelectorAll('.tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    const parent = this.closest('.tags-container');
                    const isMultiSelect = parent.closest('.form-group').querySelector('label').textContent.includes('能力') || 
                                          parent.closest('.form-group').querySelector('label').textContent.includes('快樂來源');
                    
                    if (!isMultiSelect) {
                        parent.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
                    }
                    
                    this.classList.toggle('selected');
                    
                    const hiddenInput = parent.nextElementSibling;
                    if (hiddenInput && hiddenInput.type === 'hidden') {
                        if (isMultiSelect) {
                            const selected = Array.from(parent.querySelectorAll('.tag.selected'))
                                .map(t => t.dataset.value);
                            hiddenInput.value = selected.join(',');
                        } else {
                            hiddenInput.value = this.dataset.value || '';
                            if (this.dataset.icon) {
                                const iconInput = hiddenInput.nextElementSibling;
                                if (iconInput && iconInput.id.includes('Icon')) {
                                    iconInput.value = this.dataset.icon;
                                }
                            }
                            if (this.dataset.category) {
                                const categoryInput = document.getElementById('emoCategory');
                                if (categoryInput) {
                                    categoryInput.value = this.dataset.category;
                                }
                            }
                        }
                    }
                    
                    if (this.closest('#emotionForm') && this.dataset.category) {
                        const category = this.dataset.category;
                        const anxietyFields = document.getElementById('anxietyFields');
                        const happyFields = document.getElementById('happyFields');
                        const mixedFields = document.getElementById('mixedFields');
                        
                        anxietyFields.style.display = 'none';
                        happyFields.style.display = 'none';
                        mixedFields.style.display = 'none';
                        
                        if (category === 'anxiety') {
                            anxietyFields.style.display = 'block';
                            loadSuggestedActions();
                        } else if (category === 'happy') {
                            happyFields.style.display = 'block';
                        } else if (category === 'mixed') {
                            mixedFields.style.display = 'block';
                            loadMixedSuggestedActions();
                        }
                    }
                });
            });
        });
        
        document.getElementById('emoIntensity').addEventListener('input', function() {
            document.getElementById('emoIntensityValue').textContent = this.value;
        });
        
        function loadSuggestedActions() {
            const container = document.getElementById('suggestedActions');
            container.innerHTML = '';
            
            commonActions.forEach(action => {
                const tag = document.createElement('div');
                tag.className = 'tag';
                tag.textContent = action;
                tag.addEventListener('click', function() {
                    container.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('selectedAction').value = action;
                });
                container.appendChild(tag);
            });
        }
        
        function loadMixedSuggestedActions() {
            const container = document.getElementById('mixedSuggestedActions');
            container.innerHTML = '';
            
            commonActions.forEach(action => {
                const tag = document.createElement('div');
                tag.className = 'tag';
                tag.textContent = action;
                tag.addEventListener('click', function() {
                    container.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('mixedSelectedAction').value = action;
                });
                container.appendChild(tag);
            });
        }
        
        document.getElementById('achievementForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const record = {
                id: Date.now(),
                type: 'achievement',
                time: document.getElementById('achTime').value,
                title: document.getElementById('achTitle').value,
                category: document.getElementById('achCategory').value,
                skills: document.getElementById('achSkills').value.split(',').filter(s => s)
            };
            
            records.unshift(record);
            saveData();
            
            showMessage('已記錄。恭喜你又進步了一小步！');
            this.reset();
            document.querySelectorAll('.tag.selected').forEach(t => t.classList.remove('selected'));
            
            setTimeout(() => showScreen('homeScreen'), 2000);
        });
        
        document.getElementById('emotionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const emoType = document.getElementById('emoType').value;
            const category = document.getElementById('emoCategory').value;
            
            const record = {
                id: Date.now(),
                type: 'emotion',
                time: document.getElementById('emoTime').value,
                emotionType: emoType,
                emotionIcon: document.getElementById('emoIcon').value,
                category: category,
                intensity: document.getElementById('emoIntensity').value,
                context: {
                    person: document.getElementById('emoPerson').value,
                    place: document.getElementById('emoPlace').value,
                    event: document.getElementById('emoEvent').value,
                    weather: document.getElementById('emoWeather').value
                }
            };
            
            if (category === 'anxiety') {
                record.expectation = document.getElementById('emoExpectation').value;
                const selectedAction = document.getElementById('selectedAction').value;
                const customAction = document.getElementById('customAction').value;
                record.action = customAction || selectedAction;
            } 
            else if (category === 'happy') {
                record.happySource = document.getElementById('happySource').value;
            } 
            else if (category === 'mixed') {
                record.happySource = document.getElementById('mixedHappySource').value;
                const selectedAction = document.getElementById('mixedSelectedAction').value;
                const customAction = document.getElementById('mixedCustomAction').value;
                record.action = customAction || selectedAction;
            }
            
            records.unshift(record);
            saveData();
            
            let message = '已記錄。';
            if (category === 'happy') {
                message += '記得時常回顧這些美好時刻！';
            } else if (category === 'anxiety') {
                message += '試試看你選擇的行動，記得稍後記錄感受變化。';
            } else {
                message += '你的每一個感受都值得被記錄。';
            }
            
            showMessage(message);
            this.reset();
            document.querySelectorAll('.tag.selected').forEach(t => t.classList.remove('selected'));
            document.getElementById('anxietyFields').style.display = 'none';
            document.getElementById('happyFields').style.display = 'none';
            document.getElementById('mixedFields').style.display = 'none';
            document.getElementById('emoIntensityValue').textContent = '5';
            
            setTimeout(() => showScreen('homeScreen'), 2500);
        });
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderRecords(this.dataset.filter);
            });
        });
        
        function renderRecords(filter) {
            const container = document.getElementById('recordsList');
            container.innerHTML = '';
            
            let filteredRecords = records;
            
            if (filter === 'achievements') {
                filteredRecords = records.filter(r => r.type === 'achievement');
            } else if (filter === 'happy') {
                filteredRecords = records.filter(r => 
                    r.type === 'emotion' && r.category === 'happy'
                );
            } else if (filter === 'anxiety') {
                filteredRecords = records.filter(r => 
                    r.type === 'emotion' && r.category === 'anxiety'
                );
            } else if (filter === 'all-emotions') {
                filteredRecords = records.filter(r => r.type === 'emotion');
            } else if (filter === 'actions') {
                renderActions();
                return;
            }
            
            if (filteredRecords.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <div class="empty-text">還沒有記錄<br>開始記錄你的成長與情緒吧！</div>
                    </div>
                `;
                return;
            }
            
            filteredRecords.forEach(record => {
                const card = createRecordCard(record);
                container.appendChild(card);
            });
        }
        
        function createRecordCard(record) {
            const card = document.createElement('div');
            card.className = 'record-card';
            
            const date = new Date(record.time);
            const timeStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
            
            if (record.type === 'achievement') {
                card.innerHTML = `
                    <div class="record-header">
                        <span class="record-time">${timeStr}</span>
                        <div>
                            <span class="record-type">✨</span>
                            <button onclick="editRecord(${record.id}); event.stopPropagation();" style="margin-left: 0.5rem; background: var(--sand); border: 1px solid var(--clay); border-radius: 6px; padding: 0.25rem 0.5rem; cursor: pointer; font-size: 0.8rem;">✏️</button>
                        </div>
                    </div>
                    <div class="record-title">${record.title}</div>
                    <div class="record-meta">${record.category} · ${record.skills.join(' · ')}</div>
                    <div class="record-details">
                        <div class="record-detail-item">
                            <div class="record-detail-label">分類</div>
                            <div class="record-detail-content">${record.category}</div>
                        </div>
                        <div class="record-detail-item">
                            <div class="record-detail-label">展現能力</div>
                            <div class="record-detail-content">${record.skills.join('、')}</div>
                        </div>
                    </div>
                `;
            } else {
                const contextParts = [];
                if (record.context.person) contextParts.push(`👤 ${record.context.person}`);
                if (record.context.place) contextParts.push(`📍 ${record.context.place}`);
                if (record.context.weather) contextParts.push(`${record.context.weather}`);
                
                card.innerHTML = `
                    <div class="record-header">
                        <span class="record-time">${timeStr}</span>
                        <div>
                            <span class="record-type">${record.emotionIcon}</span>
                            <button onclick="editRecord(${record.id}); event.stopPropagation();" style="margin-left: 0.5rem; background: var(--sand); border: 1px solid var(--clay); border-radius: 6px; padding: 0.25rem 0.5rem; cursor: pointer; font-size: 0.8rem;">✏️</button>
                        </div>
                    </div>
                    <div class="record-title">${record.emotionType} · 強度 ${record.intensity}</div>
                    ${contextParts.length > 0 ? `<div class="record-meta">${contextParts.join(' · ')}</div>` : ''}
                    <div class="record-details">
                        ${record.context.event ? `
                            <div class="record-detail-item">
                                <div class="record-detail-label">事件</div>
                                <div class="record-detail-content">${record.context.event}</div>
                            </div>
                        ` : ''}
                        ${record.expectation ? `
                            <div class="record-detail-item">
                                <div class="record-detail-label">期待</div>
                                <div class="record-detail-content">${record.expectation}</div>
                            </div>
                        ` : ''}
                        ${record.action ? `
                            <div class="record-detail-item">
                                <div class="record-detail-label">採取行動</div>
                                <div class="record-detail-content">${record.action}</div>
                            </div>
                        ` : ''}
                        ${record.happySource ? `
                            <div class="record-detail-item">
                                <div class="record-detail-label">快樂來源</div>
                                <div class="record-detail-content">${record.happySource}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
            
            card.addEventListener('click', function(e) {
                if (e.target.tagName === 'BUTTON') return;
                const details = this.querySelector('.record-details');
                details.classList.toggle('active');
            });
            
            return card;
        }
        
        function renderActions() {
            const container = document.getElementById('recordsList');
            container.innerHTML = '';
            
            const actionStats = {};
            records.forEach(record => {
                if (record.action) {
                    if (!actionStats[record.action]) {
                        actionStats[record.action] = {
                            count: 0,
                            contexts: []
                        };
                    }
                    actionStats[record.action].count++;
                    actionStats[record.action].contexts.push({
                        time: record.time,
                        context: record.context.event || record.expectation || '焦慮時刻'
                    });
                }
            });
            
            if (Object.keys(actionStats).length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎯</div>
                        <div class="empty-text">還沒有行動記錄<br>下次焦慮時試著記錄你的行動吧！</div>
                    </div>
                `;
                return;
            }
            
            const sortedActions = Object.entries(actionStats)
                .sort((a, b) => b[1].count - a[1].count);
            
            sortedActions.forEach(([action, stats]) => {
                const item = document.createElement('div');
                item.className = 'action-item';
                
                const contextsHtml = stats.contexts.slice(0, 3).map(c => {
                    const date = new Date(c.time);
                    const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;
                    return `<div>${dateStr}: ${c.context}</div>`;
                }).join('');
                
                item.innerHTML = `
                    <div class="action-content">${action}</div>
                    <div class="action-stats">使用次數: ${stats.count}</div>
                    <div class="action-usage">
                        <div style="margin-bottom: 0.25rem; font-weight: 500;">使用情境:</div>
                        ${contextsHtml}
                        ${stats.contexts.length > 3 ? `<div style="margin-top: 0.25rem;">...還有 ${stats.contexts.length - 3} 次</div>` : ''}
                    </div>
                `;
                
                container.appendChild(item);
            });
        }
        
        function showMessage(text) {
            document.getElementById('messageText').textContent = text;
            document.getElementById('message').classList.add('active');
        }
        
        function closeMessage() {
            document.getElementById('message').classList.remove('active');
        }
        
        function showExportMenu() {
            document.getElementById('exportMenu').classList.add('active');
        }
        
        function closeExportMenu() {
            document.getElementById('exportMenu').classList.remove('active');
        }
        
        function triggerImport() {
            document.getElementById('importFile').click();
        }
        
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let importedRecords = [];
                    
                    if (file.name.endsWith('.json')) {
                        const data = JSON.parse(e.target.result);
                        importedRecords = data.records || data;
                    }
                    
                    if (importedRecords.length === 0) {
                        showMessage('沒有找到可匯入的記錄');
                        closeExportMenu();
                        return;
                    }
                    
                    const existingIds = new Set(records.map(r => r.id));
                    const newRecords = importedRecords.filter(r => !existingIds.has(r.id));
                    
                    records = [...records, ...newRecords];
                    records.sort((a, b) => new Date(b.time) - new Date(a.time));
                    
                    saveData();
                    
                    closeExportMenu();
                    showMessage(`成功匯入 ${newRecords.length} 筆記錄！\n(跳過 ${importedRecords.length - newRecords.length} 筆重複記錄)`);
                    
                    if (document.getElementById('recordsScreen').classList.contains('active')) {
                        const activeTab = document.querySelector('.filter-tab.active');
                        if (activeTab) {
                            renderRecords(activeTab.dataset.filter);
                        }
                    }
                } catch (error) {
                    console.error('Import error:', error);
                    showMessage('匯入失敗：檔案格式不正確');
                    closeExportMenu();
                }
            };
            
            reader.readAsText(file);
            event.target.value = '';
        }
        
        function editRecord(recordId) {
            const record = records.find(r => r.id === recordId);
            if (!record) return;
            
            document.getElementById('editRecordId').value = record.id;
            document.getElementById('editTime').value = record.time;
            
            if (record.type === 'achievement') {
                document.getElementById('editTitleGroup').style.display = 'block';
                document.getElementById('editEmotionGroup').style.display = 'none';
                document.getElementById('editActionGroup').style.display = 'none';
                document.getElementById('editEventGroup').style.display = 'none';
                
                document.getElementById('editTitle').value = record.title;
            } else {
                document.getElementById('editTitleGroup').style.display = 'none';
                document.getElementById('editEmotionGroup').style.display = 'block';
                document.getElementById('editEventGroup').style.display = 'block';
                
                document.getElementById('editIntensity').value = record.intensity;
                document.getElementById('editIntensityValue').textContent = record.intensity;
                document.getElementById('editEvent').value = record.context.event || '';
                
                if (record.action || record.category === 'anxiety' || record.category === 'mixed') {
                    document.getElementById('editActionGroup').style.display = 'block';
                    document.getElementById('editAction').value = record.action || '';
                    
                    const container = document.getElementById('editSuggestedActions');
                    container.innerHTML = '';
                    commonActions.forEach(action => {
                        const tag = document.createElement('div');
                        tag.className = 'tag';
                        if (action === record.action) {
                            tag.classList.add('selected');
                        }
                        tag.textContent = action;
                        tag.addEventListener('click', function() {
                            container.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
                            this.classList.add('selected');
                            document.getElementById('editAction').value = action;
                        });
                        container.appendChild(tag);
                    });
                } else {
                    document.getElementById('editActionGroup').style.display = 'none';
                }
            }
            
            document.getElementById('editModal').classList.add('active');
        }
        
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        
        document.getElementById('editIntensity').addEventListener('input', function() {
            document.getElementById('editIntensityValue').textContent = this.value;
        });
        
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const recordId = parseInt(document.getElementById('editRecordId').value);
            const recordIndex = records.findIndex(r => r.id === recordId);
            
            if (recordIndex === -1) return;
            
            const record = records[recordIndex];
            record.time = document.getElementById('editTime').value;
            
            if (record.type === 'achievement') {
                record.title = document.getElementById('editTitle').value;
            } else {
                record.intensity = document.getElementById('editIntensity').value;
                record.context.event = document.getElementById('editEvent').value;
                
                if (document.getElementById('editActionGroup').style.display !== 'none') {
                    const newAction = document.getElementById('editAction').value;
                    record.action = newAction;
                }
            }
            
            records.sort((a, b) => new Date(b.time) - new Date(a.time));
            
            saveData();
            
            closeEditModal();
            showMessage('記錄已更新！');
            
            const activeTab = document.querySelector('.filter-tab.active');
            if (activeTab) {
                renderRecords(activeTab.dataset.filter);
            }
        });
        
        function exportToCSV() {
            if (records.length === 0) {
                showMessage('目前沒有記錄可以匯出');
                closeExportMenu();
                return;
            }
            
            let csv = '\uFEFF';
            csv += '日期,時間,類型,標題/情緒,分類/強度,詳細內容,人,地,天氣,能力標籤,期待,採取行動,快樂來源\n';
            
            records.forEach(record => {
                const date = new Date(record.time);
                const dateStr = `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
                const timeStr = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                
                if (record.type === 'achievement') {
                    csv += `"${dateStr}","${timeStr}","完成事項","${record.title}","${record.category}","","","","","${record.skills.join('、')}","","",""\n`;
                } else {
                    const event = (record.context.event || '').replace(/"/g, '""');
                    csv += `"${dateStr}","${timeStr}","情緒記錄","${record.emotionType}","${record.intensity}","${event}","${record.context.person || ''}","${record.context.place || ''}","${record.context.weather || ''}","","${record.expectation || ''}","${record.action || ''}","${record.happySource || ''}"\n`;
                }
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `心流存摺_${new Date().toISOString().slice(0, 10)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            closeExportMenu();
            showMessage('CSV 檔案已下載！可以用 Excel 或 Google Sheets 開啟');
        }
        
        function exportToJSON() {
            if (records.length === 0) {
                showMessage('目前沒有記錄可以匯出');
                closeExportMenu();
                return;
            }
            
            const exportData = {
                exportDate: new Date().toISOString(),
                totalRecords: records.length,
                records: records
            };
            
            const json = JSON.stringify(exportData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `心流存摺_${new Date().toISOString().slice(0, 10)}.json`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            closeExportMenu();
            showMessage('JSON 檔案已下載！可以用來備份或匯入 Notion');
        }
        
        setCurrentTime();
    </script>
</body>
</html>
